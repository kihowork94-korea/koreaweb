version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - yarn install --frozen-lockfile || (sleep 5 && yarn install --frozen-lockfile)
    build:
      commands:
        # Production 브랜치에만 Clarity 활성화
        - if [ "$AWS_BRANCH" = "production" ]; then export NUXT_PUBLIC_CLARITY_ID=wykwd6r9ip; fi
        - rm -rf .nuxt .output
        - yarn build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
